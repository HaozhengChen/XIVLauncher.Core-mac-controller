name: Release macOS

on:
  push:
    tags:
      - "*.*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-macos:
    if: github.repository == 'RikaKagurasaka/XIVLauncher.Core'
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ssh-key: ${{ secrets.SUBMODULE_SSH_KEY }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check release version
        working-directory: ./src/XIVLauncher.Core
        run: |
          grep -F "<Version>${GITHUB_REF_NAME}</Version>" XIVLauncher.Core.csproj

      - name: Restore
        working-directory: ./src/XIVLauncher.Core
        run: dotnet restore

      - name: Publish Apple Silicon build
        working-directory: ./src/XIVLauncher.Core
        run: dotnet publish -r osx-arm64 --self-contained --configuration Release --no-restore -o ./dist/XIVLauncher.Core-osx-arm64

      - name: Package release files
        run: |
          mkdir -p ./release
          tar -czf ./release/XIVLauncher.Core-osx-arm64.tar.gz -C ./src/XIVLauncher.Core/dist/XIVLauncher.Core-osx-arm64 .
          shasum -a 256 ./release/XIVLauncher.Core-osx-arm64.tar.gz > ./release/SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ./release/XIVLauncher.Core-osx-arm64.tar.gz
            ./release/SHA256SUMS.txt
